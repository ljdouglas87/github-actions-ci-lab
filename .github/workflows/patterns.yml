name: Patterns
run-name: Patterns run ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combos:
    name: ${{ matrix.os }} - Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
        exclude:
          - os: windows-latest
            node-version: 22
        include:
          - os: ubuntu-latest
            node-version: 24
            coverage: true
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show this combination
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage || false }}
        run: echo "$RUNNER_OS with Node $(node --version), coverage=$COVERAGE"

  cache:
    name: Cache with restore-keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore the cache
        id: cache
        uses: actions/cache@v6
        with:
          path: lab-cache
          key: lab-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            lab-${{ runner.os }}-

      - name: Show what was restored
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit=$HIT"
          mkdir -p lab-cache
          cat lab-cache/runs.txt 2>/dev/null || echo "nothing restored"
          echo "saved by run $GITHUB_RUN_NUMBER" >> lab-cache/runs.txt
