name: Jobs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-file:
    name: Make a file
    runs-on: ubuntu-latest
    steps:
      - name: Write a file on this runner
        run: |
          echo "Made by run $GITHUB_RUN_NUMBER on $RUNNER_OS" > note.txt
          cat note.txt

      - name: Keep the file as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: note
          path: note.txt
          retention-days: 1

  windows:
    name: On Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: The same kind of command on another OS
        run: echo "Runner OS is $RUNNER_OS, home is $HOME"

  in-container:
    name: In a container
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - name: Look around the container
        run: |
          head -n 2 /etc/os-release
          echo "Node.js $(node --version)"

  database:
    name: With a database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Store a row and read it back
        run: |
          psql -c "CREATE TABLE results (operation text, value int);"
          psql -c "INSERT INTO results VALUES ('2 + 3', 5);"
          psql -c "SELECT * FROM results;"

  use-file:
    name: Use the file
    needs: [make-file, windows, in-container, database]
    runs-on: ubuntu-latest
    steps:
      - name: Look for the file on this new machine
        run: |
          ls -la
          if [ -f note.txt ]; then echo "note.txt is here"; else echo "note.txt is not here"; fi

      - name: Download the artifact
        uses: actions/download-artifact@v8
        with:
          name: note

      - name: Read the file
        run: cat note.txt
